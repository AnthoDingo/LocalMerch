# Publie une release quand un tag vX.Y.Z est poussé :
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test -c Release

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          for rid in linux-x64 linux-arm64; do
            dotnet publish src/LocalMerch.App -c Release -r "$rid" --self-contained \
              -p:Version="$version" -o "out/$rid/localmerch"
            cp deploy/localmerch.service "out/$rid/localmerch/"
            tar -czf "LocalMerch-$GITHUB_REF_NAME-$rid.tar.gz" -C "out/$rid" localmerch
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LocalMerch-*.tar.gz --generate-notes
