<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalMerch — Administration</title>
<script>
  // Thème appliqué avant l'affichage (pas de flash) : choix mémorisé, sinon celui du système.
  (() => {
    const system = matchMedia('(prefers-color-scheme: dark)');
    const saved = () => { try { return localStorage.getItem('theme'); } catch { return null; } };
    const apply = () => { document.documentElement.dataset.theme = saved() || (system.matches ? 'dark' : 'light'); };
    apply();
    system.addEventListener('change', apply);
  })();
</script>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --fg: #1d2330; --muted: #667085; --line: #e4e7ec; --line-strong: #d0d5dd;
    --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eaf1ff; --accent-fg: #fff;
    --danger: #c62828; --danger-soft: #fdecec; --success: #15803d; --success-soft: #e7f6ec;
    --warn: #b45309; --warn-soft: #fff4e0; --info: #0369a1; --info-soft: #e4f2fb; --neutral-soft: #f0f2f5;
    --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 1px 3px rgb(16 24 40 / .07);
    --shadow-lg: 0 16px 40px rgb(16 24 40 / .2);
    --radius: 12px;
    color-scheme: light;
  }
  /* Thème sombre : data-theme est posé sur <html> par le script du <head>. */
  :root[data-theme="dark"] {
    --bg: #0e131a; --card: #161d27; --fg: #e6e9ef; --muted: #98a2b3; --line: #243041; --line-strong: #34425a;
    --accent: #5b93ff; --accent-hover: #78a7ff; --accent-soft: #1a2944; --accent-fg: #0b1220;
    --danger: #ff7070; --danger-soft: #3a1d22; --success: #4ade80; --success-soft: #142c1d;
    --warn: #fbbf24; --warn-soft: #33290f; --info: #38bdf8; --info-soft: #11293a; --neutral-soft: #1e2734;
    --shadow: 0 1px 2px rgb(0 0 0 / .4); --shadow-lg: 0 16px 40px rgb(0 0 0 / .55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased; }
  h2 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Mise en page et barre latérale */
  .layout { display: flex; min-height: 100vh; }
  aside { width: 232px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--card); border-right: 1px solid var(--line); transition: width .15s; overflow: hidden; }
  aside.collapsed { width: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 14px; min-height: 64px; border-bottom: 1px solid var(--line); }
  .brand img { max-height: 32px; max-width: 100%; }
  .brand strong { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .icon-btn { margin-left: auto; flex-shrink: 0; border-color: transparent; color: var(--muted); }
  .brand .icon-btn:hover { color: var(--fg); }
  aside nav { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .side-btn { display: flex; align-items: center; justify-content: flex-start; gap: 12px; width: 100%; height: auto; border: 0; background: none; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; font: inherit; font-weight: 500; color: var(--muted); text-align: left; white-space: nowrap; }
  .side-btn:hover:not(:disabled) { background: var(--neutral-soft); color: var(--fg); }
  .side-btn.active, .side-btn.active:hover { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .side-btn svg { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .side-foot { border-top: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  #account .label { overflow: hidden; text-overflow: ellipsis; }
  dl.profile { display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px; margin: 12px 0 0; }
  dl.profile dt { color: var(--muted); font-weight: 500; }
  dl.profile dd { margin: 0; }
  .side-section { margin: 16px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap; }
  .side-section:first-child { margin-top: 6px; }
  aside.collapsed .side-section { font-size: 0; margin: 8px 6px; border-top: 1px solid var(--line); }
  aside.collapsed .side-section:first-child { border-top: 0; margin: 0; }
  aside.collapsed .label, aside.collapsed .brand strong { display: none; }
  aside.collapsed .side-btn { justify-content: center; padding: 8px 0; }
  aside.collapsed .brand { flex-direction: column; justify-content: center; gap: 8px; padding: 12px 4px; }
  aside.collapsed .brand .icon-btn { margin: 0; }
  main { flex: 1; min-width: 0; padding: 28px 32px 48px; max-width: 1240px; }
  /* Petit écran : barre toujours étroite, dépliée par-dessus le contenu. */
  @media (max-width: 700px) {
    main { padding: 16px; }
    .layout { padding-left: 60px; }
    aside { position: fixed; left: 0; top: 0; z-index: 50; }
    aside:not(.collapsed) { box-shadow: var(--shadow-lg); }
  }

  /* En-tête de page */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0 auto 0 0; }
  main > p.muted { margin: -8px 0 16px; }

  /* Cartes et tableaux */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .pad { padding: 20px 24px; margin-bottom: 20px; }
  .pad > h3 + p.muted { margin-top: 0; }
  .table-wrap { overflow: auto; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  thead th { position: sticky; top: 0; background: var(--card); font-size: 12px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  .table-wrap tbody tr:hover td { background: var(--neutral-soft); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  td.empty { text-align: center; padding: 36px 14px; color: var(--muted); }
  td.row-actions { white-space: nowrap; text-align: right; }
  td.row-actions button { height: 30px; padding: 0 10px; font-size: 13px; }
  td.row-actions button + button { margin-left: 6px; }
  .section-title { margin: 28px 0 10px; }

  /* Pastilles */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px;
    font-weight: 600; background: var(--neutral-soft); color: var(--muted); white-space: nowrap; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.success { background: var(--success-soft); color: var(--success); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .badge.info { background: var(--info-soft); color: var(--info); }
  .pos { color: var(--success); font-weight: 600; }
  .neg { color: var(--danger); font-weight: 600; }

  /* Boutons et champs */
  button, input, select, textarea { font: inherit; color: inherit; }
  button, .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--fg); border-radius: 8px; cursor: pointer;
    font-weight: 500; text-decoration: none; white-space: nowrap; transition: background .12s, border-color .12s, box-shadow .12s; }
  button:hover:not(:disabled), .button:hover { background: var(--neutral-soft); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.primary:hover:not(:disabled), .button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line-strong)); }
  button.danger:hover:not(:disabled) { background: var(--danger-soft); }
  input:not([type=checkbox]):not([type=color]):not([type=file]), select, textarea {
    min-height: 34px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--card); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input:disabled, select:disabled, textarea:disabled { background: var(--neutral-soft); color: var(--muted); }
  input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  input[type=color] { width: 56px; height: 34px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--card); }
  input[type=file] { max-width: 100%; }
  input[type=file]::file-selector-button { font: inherit; margin-right: 10px; height: 32px; padding: 0 12px; border: 1px solid var(--line-strong);
    border-radius: 8px; background: var(--card); color: var(--fg); cursor: pointer; }
  textarea { resize: vertical; }
  .icon-btn { width: 34px; padding: 0; }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pager { display: flex; align-items: center; gap: 6px; }
  .pager .muted { margin-right: 2px; }

  /* Formulaires */
  form.grid { display: grid; grid-template-columns: 180px 1fr; gap: 12px 16px; align-items: center; }
  form.grid > label { color: var(--muted); font-weight: 500; }
  form.grid input:not([type=checkbox]):not([type=color]):not([type=file]), form.grid select, form.grid textarea { width: 100%; }
  form.grid input[type=checkbox] { justify-self: start; }
  @media (max-width: 600px) { form.grid { grid-template-columns: 1fr; gap: 6px; } form.grid > label { margin-top: 6px; } }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; grid-column: 1 / -1; flex-wrap: wrap; }
  .lines { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .lines table th { padding: 6px 8px; }
  .lines table td { padding: 4px 8px; border: 0; }
  .lines input, .lines select { width: 100%; }
  .perms td { padding: 3px 12px 3px 0; border: 0; }

  /* Dialogue */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(680px, 95vw); max-height: 90vh; background: var(--card);
    color: var(--fg); box-shadow: var(--shadow-lg); }
  dialog::backdrop { background: rgb(15 20 30 / .45); backdrop-filter: blur(2px); }
  dialog > h3 { margin: 0; padding: 18px 24px; border-bottom: 1px solid var(--line); font-size: 17px; }
  dialog > form { padding: 20px 24px 24px; }

  /* Touches de caisse */
  .keys { display: grid; gap: 10px; }
  .keys button { height: 84px; padding: 6px; border: 0; border-radius: 12px; color: #fff; font-weight: 600; white-space: normal;
    box-shadow: var(--shadow); text-shadow: 0 1px 1px rgb(0 0 0 / .25); transition: transform .1s, filter .1s; }
  .keys button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
  .keys button.empty { background: transparent; color: var(--muted); border: 1.5px dashed var(--line-strong);
    box-shadow: none; text-shadow: none; font-size: 20px; }
  .keys button.empty:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); transform: none; }

  /* Connexion */
  #login { width: min(380px, calc(100vw - 32px)); margin: 12vh auto; padding: 32px; display: flex; flex-direction: column; gap: 14px; }
  #login h2 { margin: 0 0 4px; text-align: center; }
  #login label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; }
  #login input { width: 100%; }
  #login button { height: 40px; margin-top: 4px; }
  #login img { display: block; max-width: 100%; max-height: 90px; margin: 0 auto; }
  #login-error { color: var(--danger); margin: 0; min-height: 1.5em; text-align: center; }
  .logo-preview { display: block; max-width: 260px; max-height: 120px; padding: 12px; margin: 12px 0;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; }

  /* Notifications */
  .toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 1000;
    max-width: min(420px, calc(100vw - 40px)); }
  .toast { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-left: 4px solid var(--success);
    border-radius: 10px; box-shadow: var(--shadow-lg); padding: 12px 16px; white-space: pre-line; cursor: pointer;
    animation: toast-in .18s ease-out; }
  .toast.danger { border-left-color: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<form id="login" class="hidden card">
  <img id="login-logo" class="hidden" alt="">
  <h2 id="login-title">LocalMerch</h2>
  <label>Identifiant<input name="username" autocomplete="username" required autofocus></label>
  <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
  <button class="primary">Connexion</button>
  <p id="login-error" class="muted"></p>
</form>
<div id="app" class="hidden">
  <div class="layout">
    <aside id="sidebar">
      <div class="brand"><img id="header-logo" class="hidden" alt=""><strong id="header-title">LocalMerch</strong>
        <button id="theme" type="button" class="icon-btn"></button></div>
      <nav id="nav" aria-label="Menu principal"></nav>
      <div class="side-foot">
        <button id="account" class="side-btn"></button>
        <button id="logout" class="side-btn" title="Déconnexion"></button>
        <button id="collapse" class="side-btn" aria-controls="sidebar"></button>
      </div>
    </aside>
    <main id="view"></main>
  </div>
</div>
<dialog id="dialog"></dialog>
<script>
const $ = s => document.querySelector(s);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e && k !== 'list' && k !== 'style') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  e.append(...kids.flat(Infinity).filter(k => k != null && k !== false));
  return e;
}

/** Notification discrète ; affichée dans le dialogue ouvert, sinon il la masquerait. */
function toast(message, tone = 'success') {
  const host = $('#dialog').open ? $('#dialog') : document.body;
  const box = host.querySelector(':scope > .toasts') ?? host.appendChild(h('div', { className: 'toasts', role: 'status', ariaLive: 'polite' }));
  const t = h('div', { className: 'toast ' + tone, onclick: () => t.remove() }, message);
  box.append(t);
  setTimeout(() => t.remove(), tone === 'danger' ? 7000 : 3500);
}

async function api(path, method = 'GET', body) {
  const r = await fetch('/api/' + path, {
    method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { showLogin(); throw new Error('Non connecté'); }
  if (!r.ok) {
    let msg = r.statusText;
    try { const j = await r.json(); msg = j.error || Object.entries(j.errors || {}).map(([k, v]) => `${k} : ${v.join(', ')}`).join('\n') || j.title || msg; } catch {}
    toast(msg, 'danger');
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}

const L = {
  Draft: 'Brouillon', Sent: 'Envoyée', Received: 'Reçue', Cancelled: 'Annulée',
  Pending: 'En attente', Accepted: 'Accepté', Rejected: 'Refusé',
  Cash: 'Espèces', Card: 'Carte',
  In: 'Entrée', Out: 'Sortie', Adjustment: 'Ajustement', Sale: 'Vente', Refund: 'Remboursement', Receipt: 'Réception',
  Product: 'Produit', VoidLast: 'Annuler la dernière ligne', ClearTicket: 'Vider le ticket',
  PayCash: 'Payer en espèces', PayCard: 'Payer par carte', GoToPage: 'Aller à la page',
  CaisseAp: 'Caisse-AP (IP)', Concert: 'Concert (IP)',
  Cheque: 'Chèque', PayCheque: 'Payer par chèque', FreeAmount: 'Montant libre', VoidSelected: 'Annuler la ligne sélectionnée',
  Standard: 'Utilisateur', Admin: 'Administrateur', None: 'Aucun accès', Read: 'Lecture', Write: 'Modification',
};
const money = v => Number(v).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const date = v => v ? new Date(v).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '';
const cache = { products: [], suppliers: [] };
const nameOf = (list, id) => cache[list].find(x => x.id === id)?.name ?? '';
const choices = list => () => cache[list].map(x => [x.id, x.name]);
const enumChoices = (...values) => () => values.map(v => [v, L[v]]);
const badge = (text, tone = '') => h('span', { className: 'badge ' + tone }, text);
const yesNo = v => v ? badge('Oui', 'success') : badge('Non');
const statusTone = { Pending: 'warn', Accepted: 'success', Rejected: 'danger', Draft: '', Sent: 'info', Received: 'success', Cancelled: 'danger' };
const statusBadge = v => badge(L[v], statusTone[v]);
async function loadLookups() {
  ({ products: cache.products, suppliers: cache.suppliers } = await api('lookups'));
}

// --- Droits ---
// Pages métier soumises à droits (identifiant de l'écran ; côté serveur : enum Page, ex. « Products »).
const businessPages = ['keys', 'sales', 'products', 'stock', 'suppliers', 'quotes', 'orders'];
const pageName = k => k[0].toUpperCase() + k.slice(1);
let me = { role: '', access: {} };
// Un administrateur peut tout ; sinon le niveau de la page doit suffire (Write inclut Read).
const can = (k, level = 'Write') => me.role === 'Admin' || me.access[k] === 'Write' || (level === 'Read' && me.access[k] === 'Read');

// --- Schémas des écrans « liste + formulaire » ---
const schemas = {
  products: {
    title: 'Produits', path: 'products', newItem: () => ({ vatRate: 20, active: true }),
    fields: [
      { name: 'name', label: 'Nom', required: true },
      { name: 'barcode', label: 'Code-barres' },
      { name: 'price', label: 'Prix TTC', type: 'number', step: '0.01', min: 0, required: true },
      { name: 'vatRate', label: 'TVA (%)', type: 'number', step: '0.1', min: 0, max: 100, required: true },
      { name: 'supplierId', label: 'Fournisseur', type: 'select', options: choices('suppliers') },
      { name: 'active', label: 'En vente', type: 'checkbox' },
    ],
    columns: [['Nom', p => p.name], ['Code-barres', p => p.barcode], ['Prix', p => money(p.price), 'num'],
      ['TVA', p => p.vatRate + ' %', 'num'], ['Fournisseur', p => nameOf('suppliers', p.supplierId)], ['En vente', p => yesNo(p.active)]],
  },
  suppliers: {
    title: 'Fournisseurs', path: 'suppliers', newItem: () => ({}),
    fields: [
      { name: 'name', label: 'Raison sociale', required: true },
      { name: 'contactName', label: 'Contact' },
      { name: 'email', label: 'E-mail', type: 'email' },
      { name: 'phone', label: 'Téléphone', type: 'tel' },
      { name: 'address', label: 'Adresse', type: 'textarea' },
      { name: 'postalCode', label: 'Code postal' },
      { name: 'city', label: 'Ville' },
      { name: 'country', label: 'Pays' },
      { name: 'notes', label: 'Notes', type: 'textarea' },
    ],
    columns: [['Nom', s => s.name], ['Contact', s => s.contactName], ['Téléphone', s => s.phone], ['E-mail', s => s.email],
      ['Adresse', s => [s.address, [s.postalCode, s.city].filter(Boolean).join(' '), s.country].filter(Boolean).join(', ')]],
  },
  quotes: {
    title: 'Devis fournisseurs', path: 'quotes', lines: true, newItem: () => ({ status: 'Pending', lines: [] }),
    fields: [
      { name: 'supplierId', label: 'Fournisseur', type: 'select', options: choices('suppliers'), required: true },
      { name: 'reference', label: 'Référence' },
      { name: 'validUntil', label: 'Valable jusqu\'au', type: 'date' },
      { name: 'status', label: 'Statut', type: 'select', options: enumChoices('Pending', 'Rejected'), required: true },
      { name: 'notes', label: 'Notes', type: 'textarea' },
    ],
    columns: [['N°', q => q.id], ['Fournisseur', q => nameOf('suppliers', q.supplierId)], ['Référence', q => q.reference, 'nowrap'],
      ['Date', q => date(q.createdAt), 'nowrap'], ['Validité', q => q.validUntil, 'nowrap'], ['Statut', q => statusBadge(q.status)], ['Total', q => money(q.total), 'num']],
    editable: q => q.status !== 'Accepted',
    actions: q => q.status === 'Pending' && can('orders') && h('button', { onclick: () => act(`quotes/${q.id}/convert`, 'Convertir ce devis en commande ?', 'Commande créée à partir du devis.') }, 'Convertir en commande'),
  },
  orders: {
    title: 'Commandes fournisseurs', path: 'orders', lines: true, newItem: () => ({ status: 'Draft', lines: [] }),
    fields: [
      { name: 'supplierId', label: 'Fournisseur', type: 'select', options: choices('suppliers'), required: true },
      { name: 'status', label: 'Statut', type: 'select', options: enumChoices('Draft', 'Sent', 'Cancelled'), required: true },
      { name: 'notes', label: 'Notes', type: 'textarea' },
    ],
    columns: [['N°', o => o.id], ['Fournisseur', o => nameOf('suppliers', o.supplierId)], ['Date', o => date(o.createdAt), 'nowrap'],
      ['Devis', o => o.quoteId], ['Statut', o => statusBadge(o.status)], ['Reçue le', o => date(o.receivedAt), 'nowrap'], ['Total', o => money(o.total), 'num']],
    editable: o => o.status !== 'Received',

// --- Formulaire générique ---
function field(f, value) {
  if (f.type === 'permissions') {
    const current = Object.fromEntries((value || []).map(p => [p.page, p.access]));
    return h('table', { className: 'perms' }, h('tbody', {}, businessPages.map(k => h('tr', {},
      h('td', {}, allViews[k][0]),
      h('td', {}, h('select', { name: pageName(k), ariaLabel: 'Droits sur ' + allViews[k][0] },
        ['None', 'Read', 'Write'].map(a => h('option', { value: a, selected: (current[pageName(k)] || 'None') === a }, L[a]))))))));
  }
  const common = { name: f.name, required: f.required };
  if (f.type === 'select') {
    return h('select', common, h('option', { value: '' }, '—'),
      f.options().map(([v, label]) => h('option', { value: v, selected: String(v) === String(value) }, label)));
  }
  if (f.type === 'textarea') return h('textarea', { ...common, rows: 3, value: value ?? '' });
  if (f.type === 'checkbox') return h('input', { ...common, type: 'checkbox', checked: !!value });
  return h('input', { ...common, type: f.type || 'text', pattern: f.pattern, placeholder: f.placeholder, autocomplete: f.autocomplete, inputMode: f.inputMode, step: f.step, min: f.min, max: f.max, value: value ?? (f.type === 'color' ? '#3b82f6' : '') });
}

function readField(f, el) {
  if (f.type === 'permissions') return [...el.querySelectorAll('select')].map(s => ({ page: s.name, access: s.value }));
  if (f.type === 'checkbox') return el.checked;
  if (el.value === '') return null;
  if (f.type === 'number' || (f.type === 'select' && /^\d+$/.test(el.value))) return Number(el.value);
  return el.value;
}

function linesEditor(lines) {
  const body = h('tbody');
  const addRow = (l = { quantity: 1, unitPrice: 0 }) => {
    const tr = h('tr', {},
      h('td', {}, h('select', { required: true, className: 'product' }, h('option', { value: '' }, '—'),
        cache.products.map(p => h('option', { value: p.id, selected: p.id === l.productId }, p.name)))),
      h('td', {}, h('input', { type: 'number', min: 1, step: 1, required: true, value: l.quantity, className: 'quantity' })),
      h('td', {}, h('input', { type: 'number', min: 0, step: '0.01', required: true, value: l.unitPrice, className: 'unitPrice' })),
      h('td', {}, h('button', { type: 'button', className: 'danger', onclick: () => tr.remove() }, '✕')));
    body.append(tr);
  };
  lines.forEach(addRow);
  const box = h('div', { className: 'lines' },
    h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Produit'), h('th', {}, 'Quantité'), h('th', {}, 'Prix unitaire HT'), h('th'))), body),
    h('button', { type: 'button', onclick: () => addRow() }, '+ Ligne'));
  box.read = () => [...body.rows].map(tr => ({
    productId: Number(tr.querySelector('.product').value),
    quantity: Number(tr.querySelector('.quantity').value),
    unitPrice: Number(tr.querySelector('.unitPrice').value),
  }));
  return box;
}

/** readOnly : consultation seule (droit de lecture sans droit de modification). */
function openForm(schema, item, onDone, readOnly = false) {
  const dlg = $('#dialog');
  const inputs = schema.fields.map(f => [f, field(f, item[f.name])]);
  const lines = schema.lines && linesEditor(item.lines || []);
  const form = h('form', { className: 'grid', method: 'dialog' },
    inputs.map(([f, el]) => [h('label', {}, f.label), el]),
    lines,
    h('div', { className: 'actions' }, readOnly
      ? h('button', { type: 'button', onclick: () => dlg.close() }, 'Fermer')
      : [
        item.id && h('button', { type: 'button', className: 'danger', style: 'margin-right:auto', onclick: async () => {
          if (!confirm('Supprimer définitivement ?')) return;
          await api(`${schema.path}/${item.id}`, 'DELETE'); dlg.close(); toast('Supprimé.'); onDone();
        } }, 'Supprimer'),
        h('button', { type: 'button', onclick: () => dlg.close() }, 'Annuler'),
        h('button', { className: 'primary' }, 'Enregistrer'),
      ]));
  if (readOnly) form.querySelectorAll('input, select, textarea, .lines button').forEach(el => { el.disabled = true; });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const data = { ...item };
    for (const [f, el] of inputs) data[f.name] = readField(f, el);
    if (lines) data.lines = lines.read();
    if (item.id) await api(`${schema.path}/${item.id}`, 'PUT', data);
    else await api(schema.path, 'POST', data);
    dlg.close();
    toast('Enregistré.');
    onDone();
  });
  dlg.replaceChildren(h('h3', {}, (readOnly ? 'Consulter — ' : item.id ? 'Modifier — ' : 'Nouveau — ') + schema.title), form);
  dlg.showModal();
}

/** Une cellule peut renvoyer du texte ou un élément (pastille…). */
function table(columns, rows, extra, empty = 'Aucun élément pour le moment.') {
  const cell = v => v instanceof Node ? v : String(v ?? '');
  return h('div', { className: 'card table-wrap' }, h('table', {},
    h('thead', {}, h('tr', {}, columns.map(([t, , cls]) => h('th', { className: cls }, t)), extra && h('th', { ariaLabel: 'Actions' }))),
    h('tbody', {}, rows.length ? rows.map(r => h('tr', {},
      columns.map(([, get, cls]) => h('td', { className: cls }, cell(get(r)))),
      extra && h('td', { className: 'row-actions' }, extra(r))))
      : h('tr', {}, h('td', { colSpan: columns.length + (extra ? 1 : 0), className: 'empty' }, empty)))));
}

async function listView(key) {
  const s = schemas[key];

let keyPage = 0;
async function keysView() {
  const [layout, keys] = await Promise.all([api('pos/layout'), api('keys')]);
  const editable = can('keys');
  const grid = h('div', { className: 'keys', style: `grid-template-columns: repeat(${layout.columns}, 1fr)` });
  for (let row = 0; row < layout.rows; row++)
    for (let column = 0; column < layout.columns; column++) {
      const at = k => k.row === row && k.column === column;
      const k = keys.find(k => k.page === keyPage && at(k)) ?? keys.find(k => k.allPages && at(k));
      grid.append(k
        ? h('button', { style: `background:${k.color}`, title: L[k.action] + (k.allPages ? ' (toutes les pages)' : ''),
            onclick: () => openForm(schemas.keys, k, render, !editable) }, k.allPages ? '★ ' + k.label : k.label)
        : h('button', { className: 'empty', disabled: !editable, onclick: () => openForm(schemas.keys,
            { page: keyPage, row, column, color: '#3b82f6', action: 'Product' }, render) }, editable ? '+' : ''));
    }
  const goTo = n => { keyPage = Math.min(99, Math.max(0, n || 0)); render(); };
  const pageInput = h('input', { type: 'number', min: 0, max: 99, value: keyPage, ariaLabel: 'Numéro de page',
    style: 'width:64px; text-align:center', onchange: e => goTo(Number(e.target.value)) });

    h('button', { type: 'button', className: 'icon-btn', ariaLabel: label, title: label, disabled, onclick: () => goTo(keyPage + delta) }, icon(name));
  return [
    h('div', { className: 'toolbar' }, h('h2', {}, 'Touches de la caisse'),
      h('div', { className: 'pager' }, h('span', { className: 'muted' }, 'Page'),
        arrow('collapse', 'Page précédente', -1, keyPage === 0), pageInput, arrow('expand', 'Page suivante', 1, keyPage === 99))),
    h('p', { className: 'muted' }, editable
      ? 'Cliquez sur une case pour créer ou modifier une touche. La caisse se met à jour immédiatement.'
      : 'Consultation seule : cliquez sur une touche pour voir son réglage.'),
    grid,
  ];
}

function backupSection() {
  const file = h('input', { type: 'file', accept: '.db' });
  const status = h('p', { className: 'muted' });
  const restore = async () => {
    const f = file.files[0];
    if (!f) return toast('Choisissez un fichier de sauvegarde (.db).', 'danger');
    if (!confirm(`Remplacer TOUTES les données et la configuration par « ${f.name} » ?\n\n` +
      'La base actuelle sera conservée dans le dossier « backups » du serveur. Vous devrez peut-être vous reconnecter.')) return;
    status.textContent = 'Restauration en cours…';
    const r = await fetch('/api/restore', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: f });
    let body = {};
    try { body = await r.json(); } catch {}
    if (!r.ok) { status.textContent = body.error || r.statusText; return; }
    alert(body.message);
    location.reload();
  };
  return h('section', { className: 'card pad' },
    h('h3', {}, 'Sauvegarde et restauration'),
    h('p', { className: 'muted' }, 'La sauvegarde contient toutes les données et toute la configuration : produits, touches, ' +
      'fournisseurs, devis, commandes, stock, ventes, utilisateurs, TPE, titre et logo. ' +
      'Les réglages système du fichier appsettings.json (port, taille de la grille) n\'en font pas partie.'),
    h('div', { className: 'toolbar', style: 'margin-top:12px' }, h('a', { className: 'button primary', href: '/api/backup', download: '' }, 'Télécharger une sauvegarde')),
    h('div', { className: 'toolbar', style: 'margin:0' }, file, h('button', { className: 'danger', onclick: restore }, 'Restaurer cette sauvegarde')),
    status);
}

          : s.lastCheck ? badge('À jour', 'success') : '')),
      a && a.notes && h('pre', { style: 'white-space:pre-wrap; font:inherit; margin:16px 0 0' }, a.notes),
      a && a.pageUrl && h('p', {}, h('a', { href: a.pageUrl, target: '_blank', rel: 'noopener' }, 'Voir la version sur GitHub')),
      a && !a.packageUrl && h('p', { className: 'muted' }, `Pas de paquet pour cette machine (${s.platform}).`),
      !s.canInstall && h('p', { className: 'muted' }, 'L\'installation n\'est possible que sous Linux.'),
      h('div', { className: 'toolbar', style: 'margin:16px 0 0' },
        h('button', { onclick: check }, 'Rechercher maintenant'),
        a && h('button', { className: 'primary', disabled: !a.packageUrl || !s.canInstall || !!s.installed, onclick: install },
          `Installer la version ${a.version}`)),
      status),
    h('section', { className: 'card pad' }, h('h3', {}, 'Automatique'),
      h('p', { className: 'muted' }, 'Recherche toutes les heures. Si l\'option est cochée, la mise à jour s\'installe seule ' +
        'au démarrage de l\'application ou entre 3 h et 5 h, pour ne pas couper une vente. ' +
        'Avant chaque mise à jour, la base est sauvegardée dans le dossier « backups » du serveur.'),
      h('div', { className: 'toolbar', style: 'margin:12px 0 0' }, auto, h('label', { htmlFor: 'auto-update' }, 'Installer les mises à jour automatiquement'))),
  ];
}

// --- Navigation ---
// Icônes 24×24 en traits (couleur = currentColor).
const icons = {
  keys: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  products: '<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/>',
  suppliers: '<rect x="2" y="6" width="12" height="10" rx="1"/><path d="M14 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  quotes: '<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/>',
  orders: '<path d="M3 4h2l3 11h11l2-8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>',
  stock: '<path d="M12 3 3 7.5 12 12l9-4.5z"/><path d="M3 12l9 4.5 9-4.5M3 16.5 12 21l9-4.5"/>',
  sales: '<path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  users: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"/>',
  terminal: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  config: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  collapse: '<path d="M15 6l-6 6 6 6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  account: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  expand: '<path d="M9 6l6 6-6 6"/>',
  updates: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5M12 8v5l3 2"/>',
};
const icon = name => { const t = document.createElement('template'); t.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`; return t.content.firstChild; };
const sideButton = (name, label, props = {}) => h('button', { className: 'side-btn', title: label, ...props }, icon(name), h('span', { className: 'label' }, label));

// Menu replié ou non : préférence propre à ce navigateur, sur grand écran seulement.
// Sur petit écran, il démarre replié et se replie après chaque choix.
const narrow = () => innerWidth <= 700;
let collapsed;
try { collapsed = localStorage.getItem('sidebar-collapsed'); } catch {}
collapsed = narrow() || collapsed === '1';
function applyCollapse() {
  $('#sidebar').classList.toggle('collapsed', collapsed);
  const label = collapsed ? 'Déplier le menu' : 'Replier le menu';
  $('#collapse').replaceChildren(icon(collapsed ? 'expand' : 'collapse'), h('span', { className: 'label' }, label));
  $('#collapse').title = label;
  $('#collapse').setAttribute('aria-expanded', String(!collapsed));
}
$('#collapse').addEventListener('click', () => {
  collapsed = !collapsed;
  if (!narrow()) try { localStorage.setItem('sidebar-collapsed', collapsed ? '1' : '0'); } catch {}
  applyCollapse();
});
$('#logout').append(icon('logout'), h('span', { className: 'label' }, 'Déconnexion'));
applyCollapse();

// Bouton clair / sombre : le choix est mémorisé et prime sur le réglage du système.
function renderThemeButton() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const label = dark ? 'Passer en mode clair' : 'Passer en mode sombre';
  $('#theme').replaceChildren(icon(dark ? 'sun' : 'moon'));
  $('#theme').title = label;
  $('#theme').setAttribute('aria-label', label);
}
$('#theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch {}
  renderThemeButton();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderThemeButton);
renderThemeButton();

async function accountView() {
  const input = (name, autocomplete) => h('input', { type: 'password', name, required: true, autocomplete,
    minLength: name === 'current' ? undefined : 8 });
  const form = h('form', { className: 'grid', style: 'max-width:560px; margin-top:12px' },
    h('label', {}, 'Mot de passe actuel'), input('current', 'current-password'),
    h('label', {}, 'Nouveau mot de passe'), input('next', 'new-password'),
    h('label', {}, 'Confirmation'), input('confirm', 'new-password'),
    h('div', { className: 'actions' }, h('button', { className: 'primary' }, 'Changer le mot de passe')));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (form.next.value !== form.confirm.value) return toast('La confirmation ne correspond pas au nouveau mot de passe.', 'danger');
    await api('me/password', 'PUT', { current: form.current.value, next: form.next.value });
    form.reset();
    toast('Mot de passe modifié.');
  });
  const tone = { Write: 'success', Read: 'info', None: '' };
  return [
    h('div', { className: 'toolbar' }, h('h2', {}, 'Mon compte')),
    h('section', { className: 'card pad' }, h('h3', {}, 'Profil'),
      h('dl', { className: 'profile' },
        h('dt', {}, 'Nom'), h('dd', {}, me.name),
        h('dt', {}, 'Identifiant'), h('dd', {}, me.login),
        h('dt', {}, 'Rôle'), h('dd', {}, badge(L[me.role], me.role === 'Admin' ? 'info' : '')))),
    h('section', { className: 'card pad' }, h('h3', {}, 'Mot de passe'),
      h('p', { className: 'muted' }, '8 caractères minimum.'), form),
    h('h3', { className: 'section-title' }, 'Mes droits'),
    me.role === 'Admin'
      ? h('p', { className: 'muted' }, 'Administrateur : accès complet à toutes les pages.')
      : table([['Page', k => allViews[k][0]], ['Droit', k => badge(L[me.access[k]], tone[me.access[k]])]], businessPages),
  ];
}

// [libellé, écran, réservé aux administrateurs]
const allViews = {
  keys: ['Touches', keysView], products: ['Produits', () => listView('products')], suppliers: ['Fournisseurs', () => listView('suppliers')],
  quotes: ['Devis', () => listView('quotes')], orders: ['Commandes', () => listView('orders')],
  stock: ['Stock', stockView], sales: ['Ventes', salesView],
  users: ['Utilisateurs', () => listView('users'), true], terminal: ['TPE', terminalView, true], config: ['Configuration', configView, true],
  updates: ['Mises à jour', () => updatesView(), true],
};
// Hors menu (bouton en bas de la barre latérale), ouvert à tout utilisateur connecté.
const accountPage = ['Mon compte', accountView];
// Menu par catégorie ; une catégorie sans écran autorisé n'est pas affichée.
const sections = [
  ['Caisse', ['keys', 'sales']],
  ['Catalogue', ['products', 'stock']],
  ['Achats', ['suppliers', 'quotes', 'orders']],
  ['Administration', ['users', 'terminal', 'config', 'updates']],
];
let views = {};
let current = 'keys';

async function render() {
  $('#nav').replaceChildren(...sections.flatMap(([title, keys]) => {
    const allowed = keys.filter(k => k in views);
    if (!allowed.length) return [];
    return [h('div', { className: 'side-section', role: 'heading', ariaLevel: '2' }, title), ...allowed.map(k => {
      const b = sideButton(k, views[k][0], { onclick: () => {
        current = k; location.hash = k;
        if (narrow() && !collapsed) { collapsed = true; applyCollapse(); }
        render();
      } });
      if (k === current) { b.classList.add('active'); b.setAttribute('aria-current', 'page'); }
      return b;
    })];
  }));
  $('#account').classList.toggle('active', current === 'account');
  $('#account').toggleAttribute('aria-current', current === 'account');
  await loadLookups();
  $('#view').replaceChildren(...[await views[current][1]()].flat(Infinity).filter(x => x != null && x !== false));
}

function showLogin() {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
}

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: e.target.username.value, password: e.target.password.value }) });
  if (!r.ok) {
    let msg = 'Identifiant ou mot de passe incorrect.';
    if (r.status === 403) try { msg = (await r.json()).error; } catch {}
    $('#login-error').textContent = msg;
    return;
  }
  $('#login-error').textContent = '';
  e.target.reset();
  start();
});
$('#account').addEventListener('click', () => {
  current = 'account'; location.hash = 'account';
  if (narrow() && !collapsed) { collapsed = true; applyCollapse(); }
  render();
});
$('#logout').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); showLogin(); });

async function start() {
  me = await api('me');
  $('#account').replaceChildren(icon('account'), h('span', { className: 'label' }, me.name));
  $('#account').title = `Mon compte — ${me.name} (${L[me.role]})`;
  views = Object.fromEntries(Object.entries(allViews).filter(([k, [, , adminOnly]]) =>
    adminOnly ? me.role === 'Admin' : can(k, 'Read')));
  const pages = Object.keys(views);
  views.account = accountPage;
  const wanted = location.hash.slice(1);
  current = wanted in views ? wanted : pages[0];
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  if (!current) {
    $('#nav').replaceChildren();
    $('#view').replaceChildren(h('h2', {}, 'Aucun accès'),
      h('p', { className: 'muted' }, 'Votre compte n\'a accès à aucune page. Demandez à un administrateur de vous attribuer des droits.'),
      h('button', { onclick: () => { current = 'account'; location.hash = 'account'; render(); } }, 'Mon compte'));
    return;
  }
  render();
}
applyBranding().catch(() => {});
start().catch(() => {});
</script>
</body>
</html>
